name: Import original Wello route images

on:
  push:
    paths:
      - '.github/workflows/import-wello-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download original Wello route assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          BASE='https://wello-accessible-wayfinding.vercel.app/assets'
          for file in floor_b2.png floor_b1.png floor_l1.png street_1.png street_2.png street_3.png street_4.png; do
            echo "Downloading $file"
            curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
              "$BASE/$file" --output "assets/$file"
            if [[ "$(file -b --mime-type "assets/$file")" != "image/png" ]]; then
              echo "Invalid image: $file" >&2
              exit 1
            fi
            test "$(stat -c%s "assets/$file")" -gt 1000
          done

      - name: Commit local images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --cached --quiet; then
            echo 'All route images are already available in the repository.'
          else
            git commit -m 'fix: bundle Wello route photos and maps in repository'
            git push origin HEAD:main
          fi
